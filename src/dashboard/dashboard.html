<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ravel Dashboard</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon16.png" />
    <link rel="stylesheet" href="../design/base.css" />
    <link rel="stylesheet" href="./dashboard.css" />
  </head>
  <body>
    <div class="ravel-intro"><div class="ravel-intro-mark" style="font-size: 22px;">RAVEL</div></div>
    <div class="ravel-noise"></div>
    <canvas class="ravel-field" id="ravel-field" aria-hidden="true"></canvas>
    <div class="ravel-cursor" id="ravel-cursor"></div>

    <div class="dash">
      <header class="dash-topbar">
        <div class="ravel-wordmark">
          <span class="ravel-wordmark-text" style="font-size: 15px; letter-spacing: 0.34em;">RAVEL</span>
          <span class="ravel-wordmark-rule" aria-hidden="true">
            <svg width="6" height="6" viewBox="0 0 9 9"><path d="M4.5 0L9 4.5L4.5 9L0 4.5Z" fill="currentColor"/></svg>
          </span>
        </div>

        <nav class="topbar-nav" id="dash-tabs">
          <button class="topbar-tab active" data-tab="home">Home</button>
          <button class="topbar-tab" data-tab="threads">Open Threads</button>
          <button class="topbar-tab" data-tab="search">Search</button>
          <button class="topbar-tab" data-tab="holes">Trails</button>
          <button class="topbar-tab" data-tab="spools">Spools</button>
        </nav>

        <button id="settings-link" class="topbar-settings">Settings</button>
      </header>

      <div class="dash-main">
        <header class="dash-header">
          <div>
            <div class="dash-eyebrow" id="dash-panel-eyebrow">LOCAL-ONLY · NOTHING LEAVES YOUR DEVICE</div>
            <h1 class="dash-title" id="dash-panel-title">Ravel</h1>
          </div>
          <div class="stat-strip" id="stat-strip"><!-- rendered by dashboard.ts --></div>
        </header>

        <main id="dash-root" class="dash-body"></main>
      </div>
    </div>
    <script type="module" src="./dashboard.js"></script>
  </body>
</html>
