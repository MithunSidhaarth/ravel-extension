<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ravel</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon16.png" />
    <link rel="stylesheet" href="../design/base.css" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="ravel-noise"></div>
    <div class="popup">
      <div class="ravel-ornament corner-tr" aria-hidden="true">
        <svg width="86" height="86" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M120 1 C 92 6, 67 18, 51 40" stroke="currentColor" stroke-width="1"/>
          <path d="M51 40 C 45 30, 41 19, 43 6" stroke="currentColor" stroke-width="1"/>
          <path d="M93 9 C 97 3, 105 1, 111 5 C 105 10, 98 14, 93 9 Z" fill="currentColor"/>
          <path d="M79 17 C 83 10, 91 7, 98 10 C 92 15, 85 20, 79 17 Z" fill="currentColor"/>
          <path d="M66 27 C 69 19, 77 15, 84 17 C 79 23, 72 29, 66 27 Z" fill="currentColor"/>
          <path d="M56 37 C 58 29, 65 24, 72 26 C 67 32, 61 38, 56 37 Z" fill="currentColor"/>
          <circle cx="51" cy="40" r="1.6" fill="currentColor"/>
        </svg>
      </div>
      <div class="ravel-ornament corner-bl" aria-hidden="true">
        <svg width="108" height="70" viewBox="0 0 140 90" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 78 C 24 66, 46 64, 68 74 L68 20 C 46 10, 24 12, 2 24 Z" stroke="currentColor" stroke-width="1"/>
          <path d="M134 78 C 112 66, 90 64, 68 74 L68 20 C 90 10, 112 12, 134 24 Z" stroke="currentColor" stroke-width="1"/>
          <path d="M14 32 C 30 26, 46 26, 60 32" stroke="currentColor" stroke-width="0.75"/>
          <path d="M14 42 C 30 36, 46 36, 60 42" stroke="currentColor" stroke-width="0.75"/>
          <path d="M14 52 C 30 46, 46 46, 60 52" stroke="currentColor" stroke-width="0.75"/>
          <path d="M80 32 C 94 26, 110 26, 126 32" stroke="currentColor" stroke-width="0.75"/>
          <path d="M80 42 C 94 36, 110 36, 126 42" stroke="currentColor" stroke-width="0.75"/>
          <path d="M80 52 C 94 46, 110 46, 126 52" stroke="currentColor" stroke-width="0.75"/>
        </svg>
      </div>
      <header class="popup-header">
        <div class="ravel-wordmark">
          <span class="ravel-wordmark-text" style="font-size: 13px; letter-spacing: 0.34em;">RAVEL</span>
          <span class="ravel-wordmark-rule" aria-hidden="true">
            <svg width="5" height="5" viewBox="0 0 9 9"><path d="M4.5 0L9 4.5L4.5 9L0 4.5Z" fill="currentColor"/></svg>
          </span>
        </div>
        <div class="header-right">
          <div class="live-indicator" id="status-dot" title="Tracking active">
            <span class="live-dot"></span>
            <span class="live-label">ACTIVE</span>
          </div>
          <button id="tracking-toggle" class="tracking-toggle" title="Tracking is on: click to pause">
            <span class="tracking-toggle-dot"></span>
            <span id="tracking-toggle-label">LIVE</span>
          </button>
        </div>
      </header>

      <section class="threads-section">
        <div class="threads-head">
          <span class="threads-eyebrow">OPEN THREADS</span>
          <span class="threads-count" id="threads-count"></span>
        </div>
        <div id="threads-list" class="threads-list"></div>
      </section>

      <section class="search-hero">
        <div class="search-hero-label">WHAT ARE YOU TRYING TO REMEMBER?</div>
        <div class="search-hero-box">
          <span class="search-hero-icon">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="7" cy="7" r="5.1" stroke="currentColor" stroke-width="1.2"/>
              <line x1="10.8" y1="10.8" x2="14.5" y2="14.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
          </span>
          <input
            id="memory-search-input"
            class="search-hero-input"
            type="text"
            placeholder="Describe anything you remember…"
            autocomplete="off"
          />
          <button id="memory-search-clear" class="search-hero-clear" hidden title="Clear">×</button>
        </div>
      </section>

      <div id="search-results" class="search-results" hidden></div>

      <div id="idle-view">
        <div class="ravel-medallion" aria-hidden="true" style="top: 90px; left: 50%; transform: translateX(-50%);">
          <svg width="230" height="230" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <path id="popup-leaf" d="M0,-92 C6,-80 6,-68 0,-56 C-6,-68 -6,-80 0,-92 Z" fill="currentColor"/>
            </defs>
            <circle cx="200" cy="200" r="150" stroke="currentColor" stroke-width="1"/>
            <circle cx="200" cy="200" r="134" stroke="currentColor" stroke-width="0.6"/>
            <g>
              <use href="#popup-leaf" transform="translate(200,200) rotate(0)"/>
              <use href="#popup-leaf" transform="translate(200,200) rotate(24)"/>
              <use href="#popup-leaf" transform="translate(200,200) rotate(48)"/>
              <use href="#popup-leaf" transform="translate(200,200) rotate(72)"/>
              <use href="#popup-leaf" transform="translate(200,200) rotate(96)"/>
              <use href="#popup-leaf" transform="translate(200,200) rotate(120)"/>
              <use href="#popup-leaf" transform="translate(200,200) rotate(144)"/>
              <use href="#popup-leaf" transform="translate(200,200) rotate(168)"/>
              <use href="#popup-leaf" transform="translate(200,200) rotate(192)"/>
              <use href="#popup-leaf" transform="translate(200,200) rotate(216)"/>
              <use href="#popup-leaf" transform="translate(200,200) rotate(240)"/>
              <use href="#popup-leaf" transform="translate(200,200) rotate(264)"/>
              <use href="#popup-leaf" transform="translate(200,200) rotate(288)"/>
              <use href="#popup-leaf" transform="translate(200,200) rotate(312)"/>
              <use href="#popup-leaf" transform="translate(200,200) rotate(336)"/>
            </g>
            <path d="M200 165 L212 200 L200 235 L188 200 Z" stroke="currentColor" stroke-width="1"/>
            <path d="M165 200 L235 200 M200 165 L200 235" stroke="currentColor" stroke-width="0.6"/>
          </svg>
        </div>
        <div id="current-card" class="current-card" hidden>
          <div class="current-row">
            <div class="current-platform-badge" id="current-badge"></div>
            <div class="current-text">
              <div class="current-domain" id="current-domain">·</div>
              <div class="current-title" id="current-title">&nbsp;</div>
            </div>
            <div class="current-timer" id="current-timer">0:00</div>
          </div>
        </div>

        <main id="popup-root" class="popup-body">
          <!-- rendered by popup.ts -->
        </main>
      </div>

      <div class="ravel-skyline" aria-hidden="true" style="position: absolute;">
        <svg viewBox="0 0 380 46" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M0,46 L0,32 C 40,26 70,36 110,30 C 140,26 155,16 175,14 C 190,13 198,20 210,24 C 250,34 300,26 340,32 C 355,34 368,32 380,34 L380,46 Z"
            fill="currentColor"
          />
          <rect x="182" y="16" width="4" height="10" fill="currentColor"/>
          <rect x="181" y="14" width="6" height="1.4" fill="currentColor"/>
          <rect x="252" y="24" width="4" height="10" fill="currentColor"/>
          <rect x="251" y="22" width="6" height="1.4" fill="currentColor"/>
          <rect x="264" y="29" width="4" height="5" fill="currentColor"/>
        </svg>
      </div>
      <footer class="popup-footer">
        <div class="ravel-ornament-rule" aria-hidden="true">
          <svg width="7" height="7" viewBox="0 0 9 9"><path d="M4.5 0L9 4.5L4.5 9L0 4.5Z" fill="currentColor"/></svg>
        </div>
        <button id="enter-ravel" class="enter-ravel-btn">
          <svg class="enter-ravel-mark" width="6" height="6" viewBox="0 0 9 9"><path d="M4.5 0L9 4.5L4.5 9L0 4.5Z" fill="currentColor"/></svg>
          <span>ENTER RAVEL</span>
          <svg class="enter-ravel-mark" width="6" height="6" viewBox="0 0 9 9"><path d="M4.5 0L9 4.5L4.5 9L0 4.5Z" fill="currentColor"/></svg>
          <span class="arrow">→</span>
        </button>
      </footer>
    </div>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
